<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1198" viewBox="0 0 1000 1198" role="img" aria-label="Before and after: current No Man's Sky MCP tools versus No Man's Sky Direct Link">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f2a"/>
      <stop offset="0.55" stop-color="#191c52"/>
      <stop offset="1" stop-color="#3d1650"/>
    </linearGradient>
    <linearGradient id="ours" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e2592b" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="yes"><circle r="11" fill="#2ec4b6" fill-opacity="0.18" stroke="#2ec4b6" stroke-width="1.5"/><path d="M-5 0 l3.5 4 l7 -8" fill="none" stroke="#7df9e9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="ours-yes" filter="url(#glow)"><circle r="12" fill="#ff8a3d" fill-opacity="0.25" stroke="#ffb067" stroke-width="1.6"/><path d="M-5.5 0 l4 4.5 l7.5 -9" fill="none" stroke="#ffe3c2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="no"><circle r="11" fill="#ffffff" fill-opacity="0.04" stroke="#5a5f8a" stroke-width="1.2"/><path d="M-4 -4 l8 8 M4 -4 l-8 8" stroke="#6d72a3" stroke-width="2" stroke-linecap="round"/></g>
  </defs>

  <rect width="1000" height="1198" rx="18" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.6">
    <circle cx="40" cy="30" r="1.2"/><circle cx="180" cy="70" r="0.9"/><circle cx="320" cy="25" r="1.4"/><circle cx="520" cy="55" r="1"/>
    <circle cx="700" cy="20" r="1.3"/><circle cx="860" cy="60" r="1"/><circle cx="960" cy="35" r="1.5"/><circle cx="90" cy="1168" r="1.1"/>
    <circle cx="420" cy="1070" r="0.9"/><circle cx="760" cy="1055" r="1.2"/><circle cx="975" cy="980" r="1"/><circle cx="25" cy="600" r="1"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="40" y="62" font-size="15" letter-spacing="7" fill="#ffffff" opacity="0.75">NO MAN'S SKY · AI ASSISTANT TOOLING</text>
    <text x="40" y="104" font-size="38" font-weight="700" fill="url(#title)" letter-spacing="2">BEFORE &amp; AFTER</text>

    <rect x="640" y="128" width="320" height="1036" rx="14" fill="url(#ours)" stroke="#ff8a3d" stroke-opacity="0.45"/>
    <text x="555" y="166" font-size="15" font-weight="600" fill="#b9bde8" text-anchor="middle" letter-spacing="2">CURRENT TOOLS</text>
    <text x="800" y="166" font-size="16" font-weight="700" fill="#ffd27a" text-anchor="middle" letter-spacing="2">NMS DIRECT LINK</text>
    <line x1="40" y1="182" x2="960" y2="182" stroke="#ffffff" stroke-opacity="0.15"/>

    <g font-size="16" fill="#e8e9ff">
      <!-- shared -->
      <g transform="translate(0,212)"><text x="56" y="5">Where am I · portal glyphs</text><use href="#yes" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,248)"><text x="56" y="5">Coordinate conversion</text><use href="#yes" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,284)"><text x="56" y="5">Bases</text><use href="#yes" x="555"/><use href="#ours-yes" x="800"/><text x="830" y="5" font-size="12" fill="#ffd9b0">+ teleporters</text></g>
      <g transform="translate(0,320)"><text x="56" y="5">Warp route planning</text><use href="#yes" x="555"/><use href="#ours-yes" x="800"/><text x="830" y="5" font-size="12" fill="#ffd9b0">+ jumps, shortcuts</text></g>
      <g transform="translate(0,356)"><text x="56" y="5">Search planets by biome</text><use href="#yes" x="555"/><use href="#ours-yes" x="800"/><text x="830" y="5" font-size="12" fill="#ffd9b0">+ fauna counts</text></g>
      <g transform="translate(0,392)"><text x="56" y="5">System detail · what's nearby</text><use href="#yes" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,428)"><text x="56" y="5">Galaxy stats</text><use href="#yes" x="555"/><use href="#ours-yes" x="800"/></g>
      <line x1="56" y1="452" x2="944" y2="452" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="4 6"/>
      <!-- ours only -->
      <g transform="translate(0,480)"><text x="56" y="5" font-weight="700" fill="#ffd27a">Shop Scanner: dock and ask "what's here?"</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/><text x="830" y="5" font-size="12" fill="#ffd9b0">+ remembers shops</text></g>
      <g transform="translate(0,516)"><text x="56" y="5" font-weight="700" fill="#ffd27a">Station brief from the cockpit</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/><text x="830" y="5" font-size="12" fill="#ffd9b0">+ upgrade plan</text></g>
      <g transform="translate(0,552)"><text x="56" y="5">Works with any assistant (command line)</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/><text x="830" y="5" font-size="12" fill="#ffd9b0">+ Grok, scripts</text></g>
      <g transform="translate(0,588)"><text x="56" y="5">Units · nanites · quicksilver</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,624)"><text x="56" y="5">Discoveries waiting to upload</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,660)"><text x="56" y="5">Tech audit · C/B/A/S/X upgrade classes</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,696)"><text x="56" y="5">"Where is my item?" across every inventory</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,732)"><text x="56" y="5">Nanite planner</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,768)"><text x="56" y="5">Freighter · frigates · expedition ETAs</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,804)"><text x="56" y="5">Ships · corvettes · squadron</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,840)"><text x="56" y="5">Companions · eggs · arena team</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,876)"><text x="56" y="5">Settlements · judgements</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,912)"><text x="56" y="5">Missions · waypoints · item grave</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,948)"><text x="56" y="5">Reputation · alien languages</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,984)"><text x="56" y="5">Trade log · crashed markets</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,1020)"><text x="56" y="5">Wonder records · career stats</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,1056)"><text x="56" y="5">"What's ready?" timer dashboard</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,1092)"><text x="56" y="5">What changed since last session · progress</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
      <g transform="translate(0,1128)"><text x="56" y="5">Current with game 7.13 Forsaken</text><use href="#no" x="555"/><use href="#ours-yes" x="800"/></g>
    </g>

    <text x="555" y="1184" font-size="15" fill="#b9bde8" text-anchor="middle">8 tools</text>
    <text x="800" y="1184" font-size="17" font-weight="700" fill="#ffd27a" text-anchor="middle">37 tools · 3 resources</text>
    <text x="56" y="1184" font-size="13" fill="#9aa0d6">Your own save + your own screen · offline · ToS-safe</text>
  </g>
</svg>
